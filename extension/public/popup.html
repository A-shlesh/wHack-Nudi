<!doctype html>
<!-- The small window that opens when you click the Nudi icon in Chrome. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nudi</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 340px; margin: 0; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        color: #0f172a; background: #fff;
      }
      .header {
        display: flex; align-items: center; gap: 12px; padding: 18px;
        background: linear-gradient(135deg, #312e81, #4f46e5); color: #fff;
      }
      .logo {
        width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
        background: rgba(255, 255, 255, 0.16); font-size: 22px; font-weight: 700;
      }
      .name { font-size: 22px; font-weight: 700; line-height: 1.1; }
      .tagline { font-size: 13px; opacity: 0.85; }
      .content { padding: 18px; }
      .intro { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: #334155; }
      #help {
        width: 100%; min-height: 60px; border: 0; border-radius: 16px; cursor: pointer;
        background: #4f46e5; color: #fff; font-size: 19px; font-weight: 700;
        box-shadow: 0 10px 24px rgba(79, 70, 229, 0.35); transition: transform 0.15s, background 0.15s;
      }
      #help:hover { background: #4338ca; transform: translateY(-1px); }
      #help:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
      .features { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: #334155; }
      .features li { display: flex; align-items: center; gap: 10px; }
      .dot { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: #eef2ff; flex: none; }
      .status {
        display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid #e2e8f0;
        background: #f8fafc; font-size: 13px; color: #475569;
      }
      .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; flex: none; }
      .status-dot.on { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2); }
      .status-dot.off { background: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">ನು</div>
      <div>
        <div class="name">Nudi</div>
        <div class="tagline">Your friendly web helper</div>
      </div>
    </div>
    <div class="content">
      <p class="intro">I will make this page simple, warn you about scams, and read it to you.</p>
      <button id="help">Help me with this page</button>
      <ul class="features">
        <li><span class="dot">🛡️</span> Spots scams and sneaky tricks</li>
        <li><span class="dot">🔒</span> Always asks before you pay</li>
        <li><span class="dot">🎙️</span> Talk to me, or ask a question</li>
      </ul>
    </div>
    <div class="status"><span id="dot" class="status-dot"></span><span id="status">Checking helper server…</span></div>
    <script src="popup.js"></script>
  </body>
</html>
